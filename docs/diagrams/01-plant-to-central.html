<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant to central: two-tier buffering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · overview</p>
    <h1>Plant to central: two-tier buffering</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-plant-to-central-title 01-plant-to-central-desc">
        <title id="01-plant-to-central-title">Plant to central: two-tier buffering</title>
        <desc id="01-plant-to-central-desc">Machine readings flow through edge gateways into a plant Kafka cluster that buffers through a central outage, then MirrorMaker 2 pulls them over the WAN into a central Kafka cluster whose store writers upsert into PostgreSQL, where a unique key drops duplicates.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (bg -> zones -> arrows -> labels -> nodes) -->
        <rect x="40" y="88" width="816" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="944" y="88" width="288" height="512" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="92" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="112" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLANT 1 · ON-SITE</text>
        <rect x="960" y="92" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1022" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CENTRAL DATA CENTRE</text>

        <!-- Arrows -->
        <line x1="204" y1="152" x2="308" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="496" y1="152" x2="592" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="832" y1="152" x2="1008" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="712" y1="184" x2="712" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="1088" y1="184" x2="1088" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1088" y1="312" x2="1088" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1088" y1="440" x2="1088" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="220" y="132" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READINGS 1/S</text>
        <rect x="518" y="132" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="544" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACKS=ALL</text>
        <rect x="872" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="141" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAN FETCH</text>
        <rect x="720" y="210" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="219" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALARMS</text>
        <rect x="1096" y="210" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1120" y="219" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCE</text>
        <rect x="1096" y="338" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1128" y="347" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BATCH POLL</text>
        <rect x="1096" y="466" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1116" y="475" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

        <!-- Node: Machines (input) -->
        <rect x="64" y="120" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="120" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="72" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="86" y="137" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="134" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Machines</text>
        <text x="134" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">500 · OPC UA / MQTT</text>

        <!-- Node: Edge gateways (backend, stacked = replicas) -->
        <rect x="316" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="312" y="116" width="180" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <rect x="308" y="120" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="316" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="332" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="398" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edge gateways ×5</text>
        <text x="398" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one per shop · SQLite buffer</text>

        <!-- Node: Plant Kafka cluster (focal 1: holds the backlog) -->
        <rect x="592" y="120" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="592" y="120" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="600" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="618" y="137" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="712" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plant Kafka cluster</text>
        <text x="712" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 brokers · RF 3 · 7-day retention</text>

        <!-- Node: Plant operations view (optional / local) -->
        <rect x="620" y="248" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="248" width="184" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="628" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
        <text x="644" y="265" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
        <text x="712" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plant operations view</text>
        <text x="712" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local alarms · stays live</text>

        <!-- Node: MirrorMaker 2 -->
        <rect x="1008" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1016" y="128" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1036" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIRROR</text>
        <text x="1088" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MirrorMaker 2</text>
        <text x="1088" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pulls plant1.* over WAN</text>

        <!-- Node: Central Kafka cluster (store) -->
        <rect x="988" y="248" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="988" y="248" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="996" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="1014" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="1088" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Central Kafka cluster</text>
        <text x="1088" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 brokers · plant1.machine.*</text>

        <!-- Node: Store writers -->
        <rect x="988" y="376" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="996" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1010" y="393" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="1088" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store writers</text>
        <text x="1088" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consumer group · 2+ instances</text>

        <!-- Node: Central database (focal 2: the one dedup point) -->
        <rect x="968" y="504" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="968" y="504" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="976" y="512" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="988" y="521" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1088" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Central database</text>
        <text x="1088" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL · unique (machine_id, seq)</text>

        <!-- Callouts -->
        <text x="596" y="396" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Central down? The plant keeps writing here for up to 7 days.</text>
        <path d="M 602,384 C 606,320 604,250 604,188" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="604" cy="186" r="2" fill="#2d3142"/>
        <text x="924" y="540" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Every resend lands here and the key drops it.</text>
        <path d="M 930,536 H 964" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="966" cy="536" r="2" fill="#2d3142"/>

        <!-- Legend strip -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="658" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>
        <rect x="160" y="672" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="180" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>
        <rect x="280" y="672" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>
        <rect x="400" y="672" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="420" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Durable store</text>
        <rect x="540" y="672" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="560" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Local / optional</text>

        <line x1="700" y1="677" x2="728" y2="677" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="736" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>
        <line x1="840" y1="677" x2="868" y2="677" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="876" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Crosses WAN</text>
        <line x1="980" y1="677" x2="1008" y2="677" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="1016" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async / local read</text>
      </svg>
    </div>
  </div>
</body>
</html>
