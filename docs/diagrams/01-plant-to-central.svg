<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-plant-to-central-title 01-plant-to-central-desc" id="d-01-plant-to-central-root">
        <title id="01-plant-to-central-title">Plant to central: two-tier buffering</title>
        <desc id="01-plant-to-central-desc">Machine readings flow through edge gateways into a plant Kafka cluster that buffers through a central outage, then MirrorMaker 2 pulls them over the WAN into a central Kafka cluster whose store writers upsert into PostgreSQL, where a unique key drops duplicates.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-plant-to-central-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-01-plant-to-central-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-01-plant-to-central-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-01-plant-to-central-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-01-plant-to-central-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-01-plant-to-central-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="d-01-plant-to-central-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (bg -> zones -> arrows -> labels -> nodes) -->
        <rect x="40" y="88" width="816" height="256" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="944" y="88" width="288" height="512" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="56" y="92" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="112" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLANT 1 · ON-SITE</text>
        <rect x="960" y="92" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1022" y="101" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CENTRAL DATA CENTRE</text>

        <!-- Arrows -->
        <line x1="204" y1="152" x2="308" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-01-plant-to-central-arrow)"/>
        <line x1="496" y1="152" x2="592" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-01-plant-to-central-arrow)"/>
        <line x1="832" y1="152" x2="1008" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-01-plant-to-central-arrow-link)"/>
