        <rect x="540" y="672" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="560" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Local / optional</text>

