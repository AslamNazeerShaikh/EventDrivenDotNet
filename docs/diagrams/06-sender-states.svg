<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-sender-states-title 06-sender-states-desc" id="d-06-sender-states-root">
        <title id="06-sender-states-title">Gateway sender: states and transitions</title>
        <desc id="06-sender-states-desc">State machine of the edge gateway sender moving among Starting, Sending, Catching up, Retrying and Stopping, with the backlog thresholds, send failures and broker recovery that trigger each transition.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-06-sender-states-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-06-sender-states-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-06-sender-states-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-06-sender-states-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-06-sender-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-06-sender-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="d-06-sender-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             TRANSITIONS — drawn first, behind the state boxes.
             Elbows r=8. Ports on shared edges are fanned ≥12px apart.
             ============================================================ -->
        <!-- start → Starting -->
        <line x1="60" y1="140" x2="96" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Starting → Catching up (over the top, backlog > 5 s) -->
        <path d="M 180 96 V 68 Q 180 60 188 60 H 736 Q 744 60 744 68 V 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Starting → Sending (backlog ≤ 5 s) -->
        <line x1="264" y1="140" x2="368" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Sending → Catching up (backlog > 5 s) -->
        <line x1="560" y1="124" x2="648" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Catching up → Sending (backlog ≤ 5 s) -->
        <line x1="648" y1="156" x2="560" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Sending → Retrying (send failed) -->
        <path d="M 420 184 V 396 Q 420 404 428 404 H 476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Catching up → Retrying (send failed) -->
        <path d="M 792 184 V 412 Q 792 420 784 420 H 676" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Retrying → Catching up (broker back) -->
        <path d="M 600 360 V 240 Q 600 232 608 232 H 664 Q 672 232 672 240 V 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Retrying self (retry same rows) — focal -->
        <path d="M 556 448 C 556 496 636 496 636 448" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#d-06-sender-states-arrow-accent)"/>
        <!-- Sending → Stopping (shutdown) -->
        <path d="M 384 184 V 532 Q 384 540 392 540 H 1024 Q 1032 540 1032 532 V 308" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-06-sender-states-arrow)"/>
        <!-- Catching up → Stopping (shutdown) -->
        <path d="M 840 140 H 900 Q 908 140 908 148 V 232 Q 908 240 916 240 H 976" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-06-sender-states-arrow)"/>

        <!-- ============================================================
             TRANSITION LABELS — opaque masks, 6–10px clear of the stroke.
             ============================================================ -->
        <!-- Starting → Catching up, on the top channel -->
        <rect x="426" y="40" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="466" y="49" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKLOG &gt; 5 S</text>

        <!-- Starting → Sending -->
        <rect x="280" y="118" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="127" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKLOG ≤ 5 S</text>

        <!-- Sending → Catching up -->
        <rect x="568" y="106" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="115" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKLOG &gt; 5 S</text>

        <!-- Catching up → Sending -->
        <rect x="568" y="138" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="147" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKLOG ≤ 5 S</text>

        <!-- Sending → Retrying, beside the vertical segment -->
        <rect x="428" y="276" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="285" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND FAILED</text>

        <!-- Catching up → Retrying, beside the vertical segment -->
        <rect x="800" y="276" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="836" y="285" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND FAILED</text>

        <!-- Retrying → Catching up, beside the vertical segment -->
        <rect x="608" y="288" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="297" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROKER BACK</text>

        <!-- Retrying self -->
        <rect x="540" y="500" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="509" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY SAME ROWS</text>

        <!-- Sending → Stopping, on the bottom channel -->
        <rect x="572" y="524" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="533" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHUTDOWN</text>

        <!-- Catching up → Stopping -->
        <rect x="852" y="122" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="884" y="131" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHUTDOWN</text>

        <!-- ============================================================
             START DOT + STATE BOXES — drawn after arrows and labels.
             States: rx=8. Box y=96..184 (row 1), y=360..448 (Retrying).
             ============================================================ -->
        <circle cx="52" cy="140" r="6" fill="#2d3142"/>

        <!-- State: Starting -->
        <rect x="96" y="96" width="168" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="132" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Starting</text>
        <text x="180" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BOOT</text>

        <!-- State: Sending -->
        <rect x="368" y="96" width="192" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="464" y="132" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sending</text>
        <text x="464" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LIVE · OLDEST UNSENT ≤ 5 S</text>

        <!-- State: Catching up -->
        <rect x="648" y="96" width="192" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="744" y="132" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Catching up</text>
        <text x="744" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ALARMS FIRST · BIG BATCHES</text>

        <!-- State: Retrying (focal) -->
        <rect x="476" y="360" width="200" height="88" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="576" y="396" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrying</text>
        <text x="576" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BACKOFF 0.1S→30S · JITTER</text>

        <!-- State: Stopping (terminal) -->
        <rect x="976" y="220" width="208" height="88" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="1080" y="256" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stopping</text>
        <text x="1080" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UNACKED ROWS STAY ON DISK</text>

        <!-- Callout -->
        <text x="640" y="584" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">No state deletes a row without a broker ack.</text>

        <!-- ============================================================
             LEGEND — horizontal strip at the bottom.
             ============================================================ -->
        <line x1="40" y1="632" x2="1240" y2="632" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="650" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="46" cy="666" r="5" fill="#2d3142"/>
        <text x="58" y="670" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Initial</text>

        <rect x="140" y="660" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="164" y="670" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State</text>

        <rect x="260" y="660" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="284" y="670" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal · retry path</text>

        <line x1="440" y1="666" x2="468" y2="666" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-06-sender-states-arrow)"/>
        <text x="476" y="670" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>

        <line x1="580" y1="666" x2="608" y2="666" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-06-sender-states-arrow)"/>
        <text x="616" y="670" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Shutdown · rows stay on disk</text>
      </svg>
