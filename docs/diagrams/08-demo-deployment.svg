<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-demo-deployment-title 08-demo-deployment-desc" id="d-08-demo-deployment-root">
        <title id="08-demo-deployment-title">The demo on one laptop: Docker Compose</title>
        <desc id="08-demo-deployment-desc">Deployment diagram of the live demo on one MacBook: five gateways and the plant Kafka cluster on a plant network, MirrorMaker 2 attached to both the plant and central networks as the WAN link, central Kafka, two consumers and PostgreSQL on a central network, and the API and dashboard on an ops network, with a browser and a drill script running on the host.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-08-demo-deployment-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-08-demo-deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-08-demo-deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-08-demo-deployment-root .diagram-container { overflow-x: visible; }
}</style>
