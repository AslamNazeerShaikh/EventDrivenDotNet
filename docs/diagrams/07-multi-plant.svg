<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-multi-plant-title 07-multi-plant-desc" id="d-07-multi-plant-root">
        <title id="07-multi-plant-title">Adding plants without changing central code</title>
        <desc id="07-multi-plant-desc">Each plant's Kafka cluster is mirrored by MirrorMaker 2 into the central Kafka cluster under its own topic prefix, and store writers subscribe by a topic pattern so a new plant reaches the central database with no code change.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-multi-plant-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-07-multi-plant-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-07-multi-plant-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-07-multi-plant-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-07-multi-plant-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-07-multi-plant-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="d-07-multi-plant-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows: three plants fan in to MirrorMaker 2's left edge at L*k/(N+1) -->
        <path d="M 196,96 H 272 Q 280,96 280,104 V 184 Q 280,192 288,192 H 312" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow-link)"/>
        <line x1="196" y1="208" x2="312" y2="208" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow-link)"/>
        <path d="M 196,320 H 272 Q 280,320 280,312 V 232 Q 280,224 288,224 H 312" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow-link)"/>
        <line x1="512" y1="208" x2="584" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow)"/>
        <line x1="676" y1="240" x2="676" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow)"/>
        <line x1="676" y1="368" x2="676" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow)"/>

        <!-- Arrow labels -->
        <rect x="206" y="76" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="234" y="85" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAN FETCH</text>
        <rect x="524" y="188" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="197" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCE</text>
        <rect x="684" y="258" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="718" y="267" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATTERN SUB</text>
        <rect x="684" y="386" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="395" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

        <!-- Node: Plant 1 Kafka (store) -->
        <rect x="56" y="64" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="64" width="140" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="64" y="72" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="82" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="126" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plant 1 Kafka</text>
        <text x="126" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topics machine.*</text>

        <!-- Node: Plant 2 Kafka (store) -->
        <rect x="56" y="176" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="176" width="140" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="64" y="184" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="82" y="193" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="126" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plant 2 Kafka</text>
        <text x="126" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topics machine.*</text>

        <!-- Node: Plant N Kafka (optional: more plants) -->
        <rect x="56" y="288" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="288" width="140" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="64" y="296" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.25"/>
        <text x="82" y="305" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="126" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plant N Kafka</text>
        <text x="126" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same layout per plant</text>

        <!-- Node: MirrorMaker 2 -->
        <rect x="312" y="176" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="320" y="184" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="340" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIRROR</text>
        <text x="412" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MirrorMaker 2</text>
        <text x="412" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one flow per plant · adds prefix</text>

        <!-- Node: Central Kafka cluster (store) -->
        <rect x="584" y="176" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="176" width="184" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="592" y="184" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="610" y="193" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAFKA</text>
        <text x="676" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Central Kafka cluster</text>
        <text x="676" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plant1.* · plant2.* · plantN.*</text>

        <!-- Node: Store writers (focal: pattern subscription) -->
        <rect x="584" y="288" width="184" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="288" width="184" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="592" y="296" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="606" y="305" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="676" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store writers</text>
        <text x="676" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subscribe by pattern</text>
        <text x="676" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">^plant[0-9]+\.machine\.readings$</text>

        <!-- Node: Central database (store) -->
        <rect x="548" y="416" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="548" y="416" width="256" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="556" y="424" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="568" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="676" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Central database</text>
        <text x="676" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">machine_id carries the plant · P2-BDY-W042</text>

        <!-- Callouts -->
        <text x="904" y="120" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">More machines in a plant: add partitions, gateways and consumers.</text>
        <path d="M 720,128 V 174" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="720" cy="176" r="2" fill="#2d3142"/>
        <text x="56" y="404" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">A new plant is one more MirrorMaker 2 flow and one more prefix.</text>
        <path d="M 126,388 V 354" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="126" cy="352" r="2" fill="#2d3142"/>

        <!-- Legend strip -->
        <line x1="40" y1="528" x2="920" y2="528" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="546" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="560" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>
        <rect x="140" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>
        <rect x="248" y="560" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="268" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Durable store</text>
        <rect x="376" y="560" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="396" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Further plants</text>

        <line x1="512" y1="565" x2="540" y2="565" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow)"/>
        <text x="548" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>
        <line x1="640" y1="565" x2="668" y2="565" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-07-multi-plant-arrow-link)"/>
        <text x="676" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Crosses WAN</text>
      </svg>
