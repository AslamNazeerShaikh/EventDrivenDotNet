<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where duplicates come from, and the one place they stop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width); this
       wrapper lets a narrow screen scroll the diagram instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar: release the scroller in print. Must follow the svg rule. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · deduplication</p>
    <h1>Where duplicates come from, and the one place they stop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-duplicates-title 05-duplicates-desc">
        <title id="05-duplicates-title">Where duplicates come from, and the one place they stop</title>
        <desc id="05-duplicates-desc">Three sources of duplicate readings - gateway resends, MirrorMaker 2 restarts and store writer crashes - converge on one unique key (machine_id, seq) in PostgreSQL, which inserts each reading once and skips and counts the rest. Two never reach it: client retries inside one producer session are removed by the idempotent producer, and history backfill skips samples the gateway already holds.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Connectors first (behind boxes) -->
<path d="M 408,180 H 520 Q 528,180 528,188 V 256 Q 528,264 536,264 H 576" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 408,260 H 496 Q 504,260 504,268 V 280 Q 504,288 512,288 H 576" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 408,340 H 496 Q 504,340 504,332 V 320 Q 504,312 512,312 H 576" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 816,280 H 928" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 816,320 H 880 Q 888,320 888,328 V 360 Q 888,368 896,368 H 928" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="408" y1="444" x2="448" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="450" y1="436" x2="450" y2="452" stroke="#4f5d75" stroke-width="1.6"/>
<line x1="408" y1="524" x2="448" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="450" y1="516" x2="450" y2="532" stroke="#4f5d75" stroke-width="1.6"/>
<!-- Arrow labels -->
<rect x="444" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="464" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESEND</text>
<rect x="430" y="240" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="452" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-COPY</text>
<rect x="424" y="320" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="452" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDELIVER</text>
<rect x="846" y="260" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="872" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERTED</text>
<rect x="826" y="328" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="848" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SKIPPED</text>
<!-- Nodes -->
<rect x="168" y="152" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="168" y="152" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="288" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway resend</text>
<text x="288" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ack lost · new producer session</text>
<rect x="168" y="232" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="168" y="232" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="288" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MirrorMaker 2 restart</text>
<text x="288" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">re-copies since last saved offset</text>
<rect x="168" y="312" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="168" y="312" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="288" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store writer crash</text>
<text x="288" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">after DB commit, before offset commit</text>
<rect x="576" y="240" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect x="576" y="240" width="240" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
<text x="696" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unique key (machine_id, seq)</text>
<text x="696" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT … ON CONFLICT DO NOTHING</text>
<rect x="928" y="252" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="928" y="252" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="1028" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One row per reading</text>
<text x="1028" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the central database</text>
<rect x="928" y="340" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="928" y="340" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="1028" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Duplicates absorbed</text>
<text x="1028" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">received − inserted · shown live</text>
<text x="168" y="404" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NEVER REACHES THE KEY</text>
<rect x="168" y="416" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="168" y="416" width="240" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="288" y="442" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client retry in one session</text>
<text x="288" y="458" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">removed by the idempotent producer</text>
<rect x="168" y="496" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="168" y="496" width="240" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="288" y="522" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">History backfill</text>
<text x="288" y="538" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway skips what it already holds</text>
<!-- Callout (margin) -->
<path d="M 744,190 Q 696,196 696,236" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="696" cy="240" r="2" fill="#2d3142"/>
<text x="752" y="168" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Exactly-once delivery isn't possible across a network.</text>
<text x="752" y="186" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">One unique key makes the result exactly-once.</text>
<!-- Legend -->
<line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="676" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="60" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Duplicate source</text>
<rect x="160" y="676" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="180" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The one stop (focal)</text>
<rect x="292" y="676" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="312" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Central database result</text>
<rect x="440" y="676" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
<text x="460" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Removed upstream</text>
<line x1="572" y1="681" x2="600" y2="681" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<text x="608" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Same reading delivered again</text>
<line x1="760" y1="681" x2="788" y2="681" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="796" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Skipped, counted</text>
<line x1="900" y1="681" x2="924" y2="681" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="926" y1="675" x2="926" y2="687" stroke="#4f5d75" stroke-width="1.6"/>
<text x="936" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stops before the key</text>
      </svg>
    </div>
  </div>
</body>
</html>
