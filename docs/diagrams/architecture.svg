<svg viewBox="0 0 1320 937" width="1320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edd-arch-title edd-arch-desc">
  <title id="edd-arch-title">EDD demo master diagram</title>
  <desc id="edd-arch-desc">Two producers publish through Kafka topics to two consumers and SQLite sinks, driven by a command API behind nginx.</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-green-lg" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>
  <!-- White canvas rect first: light card on dark theme -->
  <rect x="0" y="0" width="1320" height="937" fill="#ffffff"/>

  <!-- Title centered on content center ((25+1306)/2 = 665) -->
  <text x="660" y="32" font-size="16" letter-spacing="1" fill="#1e293b" text-anchor="middle">EDD demo master diagram</text>

  <!-- Outer dashed group: docker container (content x=25..1295) -->
  <!-- outer: x=25, y=70, width=1270, height=735 -->
  <rect x="25" y="70" width="1270" height="735" rx="10" stroke-width="1.25" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="35" y="84" font-size="11" fill="#64748b">docker container · edd-demo · one image</text>

  <!-- Tier group: edge (x=55..1020) -->
  <!-- edge: x=55, y=95, width=965, height=113 -->
  <rect x="55" y="95" width="965" height="113" rx="10" stroke-width="1.25" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="65" y="109" font-size="11" fill="#64748b">edge tier</text>

  <!-- Node: Browser (external/input blue). box 80,120 160x54 -->
  <rect x="80" y="120" width="160" height="54" rx="6" stroke-width="1.5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="160" y="142" font-size="12" fill="#1e40af" text-anchor="middle">Browser</text>
  <text x="160" y="160" font-size="12" fill="#1e40af" text-anchor="middle">React SPA</text>

  <!-- Node: nginx (input blue). box 265,120 160x54 -->
  <rect x="265" y="120" width="160" height="54" rx="6" stroke-width="1.5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="345" y="142" font-size="12" fill="#1e40af" text-anchor="middle">nginx</text>
  <text x="345" y="160" font-size="12" fill="#1e40af" text-anchor="middle">:3000 · proxy /api</text>

  <!-- Node: Command API (analysis purple). box 450,120 220x72 -->
  <rect x="450" y="120" width="220" height="72" rx="6" stroke-width="1.5" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="560" y="142" font-size="12" fill="#6b21a8" text-anchor="middle">Command API</text>
  <text x="560" y="160" font-size="12" fill="#6b21a8" text-anchor="middle">:8080 · minimal API</text>
  <text x="560" y="178" font-size="12" fill="#6b21a8" text-anchor="middle">cmds + proof + health</text>

  <!-- Node: supervisord (plain). box 695,120 220x54 -->
  <rect x="695" y="120" width="220" height="54" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="805" y="142" font-size="12" fill="#1e293b" text-anchor="middle">supervisord · PID 1</text>
  <text x="805" y="160" font-size="12" fill="#64748b" text-anchor="middle">8 programs + init</text>

  <!-- Tier group: kafka (x=51..976) -->
  <!-- kafka: x=51, y=240, width=925, height=226 -->
  <rect x="51" y="240" width="925" height="226" rx="10" stroke-width="1.25" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="61" y="254" font-size="11" fill="#64748b">Kafka 4.4 · single-node KRaft</text>

  <!-- Node: Kafka broker (processing orange). box 76,274 180x72 -->
  <rect x="76" y="274" width="180" height="72" rx="6" stroke-width="1.5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="166" y="296" font-size="12" fill="#b45309" text-anchor="middle">Kafka 4.4 KRaft</text>
  <text x="166" y="314" font-size="12" fill="#b45309" text-anchor="middle">:9092 plain · :9093</text>
  <text x="166" y="332" font-size="12" fill="#b45309" text-anchor="middle">ctrl · heap 512M</text>

  <!-- Topic nodes (plain white, 200x72, baselines 396/414/432) -->
  <!-- t-cmds 76,374 -->
  <rect x="76" y="374" width="200" height="72" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="176" y="396" font-size="12" fill="#1e293b" text-anchor="middle">control.commands</text>
  <text x="176" y="414" font-size="12" fill="#64748b" text-anchor="middle">1 part · compacted</text>
  <text x="176" y="432" font-size="12" fill="#64748b" text-anchor="middle">API to prod x2</text>
  <!-- t-events 301,374 -->
  <rect x="301" y="374" width="200" height="72" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="401" y="396" font-size="12" fill="#1e293b" text-anchor="middle">demo.events</text>
  <text x="401" y="414" font-size="12" fill="#64748b" text-anchor="middle">6 part · key entity</text>
  <text x="401" y="432" font-size="12" fill="#64748b" text-anchor="middle">grp event-sinks</text>
  <!-- t-acks 526,374 -->
  <rect x="526" y="374" width="200" height="72" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="626" y="396" font-size="12" fill="#1e293b" text-anchor="middle">control.acks</text>
  <text x="626" y="414" font-size="12" fill="#64748b" text-anchor="middle">1 part · 1h ret</text>
  <text x="626" y="432" font-size="12" fill="#64748b" text-anchor="middle">prod to API</text>
  <!-- t-dlq 751,374 (warning pink: poison path) -->
  <rect x="751" y="374" width="200" height="72" rx="6" stroke-width="1.5" fill="#fce7f3" stroke="#ec4899"/>
  <text x="851" y="396" font-size="12" fill="#9d174d" text-anchor="middle">demo.events.dlq</text>
  <text x="851" y="414" font-size="12" fill="#9d174d" text-anchor="middle">1 part · 7d ret</text>
  <text x="851" y="432" font-size="12" fill="#9d174d" text-anchor="middle">poison only</text>

  <!-- Tier group: services (x=31..1156) -->
  <!-- services: x=31, y=494, width=1125, height=140 -->
  <rect x="31" y="494" width="1125" height="140" rx="10" stroke-width="1.25" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="41" y="508" font-size="11" fill="#64748b">services tier</text>

  <!-- Service nodes: producers blue, consumers orange. 250x90, baselines 546/564/582/600 -->
  <!-- pa 56,524 -->
  <rect x="56" y="524" width="250" height="90" rx="6" stroke-width="1.5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="181" y="546" font-size="12" fill="#1e40af" text-anchor="middle">producer-a</text>
  <text x="181" y="564" font-size="12" fill="#1e40af" text-anchor="middle">:7101 · OrderPlaced</text>
  <text x="181" y="582" font-size="12" fill="#1e40af" text-anchor="middle">100ms ticks · acks=all</text>
  <text x="181" y="600" font-size="12" fill="#1e40af" text-anchor="middle">events + cmds + beats</text>
  <!-- pb 331,524 -->
  <rect x="331" y="524" width="250" height="90" rx="6" stroke-width="1.5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="456" y="546" font-size="12" fill="#1e40af" text-anchor="middle">producer-b</text>
  <text x="456" y="564" font-size="12" fill="#1e40af" text-anchor="middle">:7102 · PaymentCaptured</text>
  <text x="456" y="582" font-size="12" fill="#1e40af" text-anchor="middle">100ms ticks · acks=all</text>
  <text x="456" y="600" font-size="12" fill="#1e40af" text-anchor="middle">events + cmds + beats</text>
  <!-- ca 606,524 -->
  <rect x="606" y="524" width="250" height="90" rx="6" stroke-width="1.5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="731" y="546" font-size="12" fill="#b45309" text-anchor="middle">consumer-a</text>
  <text x="731" y="564" font-size="12" fill="#b45309" text-anchor="middle">:7201 · ev-sinks</text>
  <text x="731" y="582" font-size="12" fill="#b45309" text-anchor="middle">batch 500 · 50ms</text>
  <text x="731" y="600" font-size="12" fill="#b45309" text-anchor="middle">commit then offset</text>
  <!-- cb 881,524 -->
  <rect x="881" y="524" width="250" height="90" rx="6" stroke-width="1.5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1006" y="546" font-size="12" fill="#b45309" text-anchor="middle">consumer-b</text>
  <text x="1006" y="564" font-size="12" fill="#b45309" text-anchor="middle">:7202 · ev-sinks</text>
  <text x="1006" y="582" font-size="12" fill="#b45309" text-anchor="middle">batch 500 · 50ms</text>
  <text x="1006" y="600" font-size="12" fill="#b45309" text-anchor="middle">commit then offset</text>

  <!-- Tier group: sinks (x=581..1156) -->
  <!-- sinks: x=581, y=672, width=575, height=108 -->
  <rect x="581" y="672" width="575" height="108" rx="10" stroke-width="1.25" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="591" y="686" font-size="11" fill="#64748b">sinks tier</text>

  <!-- Sink nodes (data green). 250x54, baselines 728/746 -->
  <!-- sinka 606,706 -->
  <rect x="606" y="706" width="250" height="54" rx="6" stroke-width="1.5" fill="#d1fae5" stroke="#22c55e"/>
  <text x="731" y="728" font-size="12" fill="#166534" text-anchor="middle">sink-a.db</text>
  <text x="731" y="746" font-size="12" fill="#166534" text-anchor="middle">WAL · 1 writer · /data</text>
  <!-- sinkb 881,706 -->
  <rect x="881" y="706" width="250" height="54" rx="6" stroke-width="1.5" fill="#d1fae5" stroke="#22c55e"/>
  <text x="1006" y="728" font-size="12" fill="#166534" text-anchor="middle">sink-b.db</text>
  <text x="1006" y="746" font-size="12" fill="#166534" text-anchor="middle">WAL · 1 writer · /data</text>

  <!-- Proof annotation, single line in the lane below edge tier -->
  <text x="940" y="226" font-size="10" fill="#64748b">Proof: Gen≥Ack=Bus≥Commit≤Persist · gaps 0</text>

  <!-- Hard-rule annotation, bottom left below outer group -->
  <text x="56" y="830" font-size="10" fill="#64748b">Hard rule: no service calls another service.</text>
  <text x="56" y="845" font-size="10" fill="#64748b">Every arrow ends at Kafka, a file, or the browser.</text>

  <!-- Connectors: curves only, 5px start / 11px end clearance -->
  <!-- A1 browser->nginx, co-axial -->
  <path d="M245,147 L 254,147" stroke-width="1.4" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <!-- A2 nginx->api, co-axial -->
  <path d="M430,147 L 439,147" stroke-width="1.4" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <!-- A3 api->t-cmds commands, enters top near right edge (10px corridor clear of broker) -->
  <path d="M560,197 C 560,280 266,290 266,363" stroke-width="1.4" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <text x="350" y="345" font-size="10" fill="#64748b" text-anchor="middle">COMMANDS</text>
  <!-- A4 t-acks->api acks, straight drop up -->
  <path d="M620,369 L 620,203" stroke-width="1.4" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <text x="560" y="317" font-size="10" fill="#64748b" text-anchor="middle">ACKS·TLM</text>
  <!-- A5 producer-a -> demo.events, up into bottom -->
  <path d="M181,519 C 181,504 386,477 386,457" stroke-width="1.4" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- A6 producer-b -> demo.events, up into bottom -->
  <path d="M456,519 C 456,504 490,477 490,457" stroke-width="1.4" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- A9 t-cmds -> producer-a commands x2 -->
  <path d="M140,451 C 140,470 150,503 150,513" stroke-width="1.4" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <text x="90" y="482" font-size="10" fill="#64748b" text-anchor="middle">COMMANDS x2</text>
  <!-- A7 demo.events -> consumer-a, down into top -->
  <path d="M450,451 C 450,480 731,483 731,513" stroke-width="1.4" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- A8 demo.events -> consumer-b right edge: exits top, travels above the topic row, down the east side -->
  <path d="M450,369 C 450,322 550,344 750,344 C 900,344 1180,354 1180,480 C 1180,550 1165,569 1145,569" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-lg)"/>
  <text x="850" y="325" font-size="10" fill="#64748b" text-anchor="middle">EVENTS</text>
  <!-- A11 consumer-a -> sink-a.db SQL batch, straight drop -->
  <path d="M731,619 L 731,695" stroke-width="1.4" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- A12 consumer-b -> sink-b.db SQL batch, straight drop -->
  <path d="M1006,619 L 1006,695" stroke-width="1.4" fill="none" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text x="818" y="692" font-size="10" fill="#64748b" text-anchor="start">SQL·BATCH</text>
  <!-- A13 consumer-a -> DLQ poison, up into bottom -->
  <path d="M800,519 C 800,480 851,480 851,457" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <!-- A14 consumer-b -> DLQ poison, up into bottom -->
  <path d="M950,519 C 950,480 911,480 911,457" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="875" y="510" font-size="10" fill="#64748b" text-anchor="middle">POISON</text>
  <!-- A15 API read backbone: two full paths sharing one trunk (identical dash phase), Q-rounded drops into each sink -->
  <path d="M560,115 C 560,90 620,80 720,80 L 1150,80 C 1200,80 1210,100 1210,150 L 1210,650 C 1210,658 1200,660 1190,660 L 812,660 Q 800,660 800,672 L 800,695" fill="none" stroke="#64748b" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <path d="M560,115 C 560,90 620,80 720,80 L 1150,80 C 1200,80 1210,100 1210,150 L 1210,650 C 1210,658 1200,660 1190,660 L 1082,660 Q 1070,660 1070,672 L 1070,695" fill="none" stroke="#64748b" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <circle cx="800" cy="660" r="3.5" fill="#64748b"/>
  <circle cx="1070" cy="660" r="3.5" fill="#64748b"/>
  <text x="1252" y="400" font-size="10" fill="#64748b" text-anchor="middle">READ-ONLY</text>

  <!-- Legend strip -->
  <line x1="40" y1="880" x2="1280" y2="880" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="40" y="896" font-size="8" fill="#64748b">LEGEND</text>

  <!-- Legend keys use circles/lines (not rects): no block-spacing adjacency, labels clear neighbours by >10px -->
  <circle cx="47" cy="907" r="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="63" y="912" font-size="8.5" fill="#64748b">Focal · Kafka broker</text>

  <circle cx="190" cy="907" r="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="206" y="912" font-size="8.5" fill="#64748b">Entry / producer</text>

  <circle cx="313" cy="907" r="5" fill="#d1fae5" stroke="#22c55e" stroke-width="1"/>
  <text x="329" y="912" font-size="8.5" fill="#64748b">Data sink</text>

  <circle cx="402" cy="907" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="912" font-size="8.5" fill="#64748b">Topic / tooling</text>

  <line x1="515" y1="908" x2="543" y2="908" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <text x="561" y="912" font-size="8.5" fill="#64748b">HTTP edge</text>

  <line x1="626" y1="908" x2="654" y2="908" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="672" y="912" font-size="8.5" fill="#64748b">Data flow</text>

  <line x1="744" y1="908" x2="772" y2="908" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="790" y="912" font-size="8.5" fill="#64748b">DLQ poison</text>

  <line x1="867" y1="908" x2="895" y2="908" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="913" y="912" font-size="8.5" fill="#64748b">Passive read</text>

  <circle cx="1000" cy="907" r="3.5" fill="#64748b"/>
  <text x="1011" y="912" font-size="8.5" fill="#64748b">Fan-out</text>
</svg>
