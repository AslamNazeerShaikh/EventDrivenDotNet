<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDD demo in one container · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    .diagram-container svg { width: 100%; min-width: 1280px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      .diagram-container svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Kafka 4.4 · .NET 11</p>
    <h1>EDD demo in one container</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">EDD demo in one container</title>
      <desc id="architecture-desc">Architecture of the event-driven demo: a browser reaches nginx and the command API, two producers and two consumers talk only through the Kafka broker, and SQLite sinks persist events in one Docker container.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: Docker container (drawn before arrows and nodes) -->
        <rect x="216" y="84" width="868" height="532" rx="8"

        <text x="650" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"

        <line x1="580" y1="176" x2="660" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- producer-a -> Kafka events -->

              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
