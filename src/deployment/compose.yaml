name: edd

x-gateway: &gateway
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    target: gateway
  environment: &gateway-env
    Gateway__Plant: P1
    Gateway__FaultsPerMinute: "0.5"
    Kafka__BootstrapServers: plant-kafka:9092
    Buffer__Path: /data/buffer.db
    ASPNETCORE_HTTP_PORTS: "8080"
  depends_on:
    plant-topics:
      condition: service_completed_successfully
  mem_limit: 256m
  memswap_limit: 256m
  restart: on-failure
  networks: [plant]

x-consumer: &consumer
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    target: consumer
  environment: &consumer-env
    Consumer__MaxRowsPerSecond: "1000"
    Kafka__BootstrapServers: central-kafka:9092
    ConnectionStrings__Central: Host=central-db;Username=edd;Password=edd;Database=edd
    ASPNETCORE_HTTP_PORTS: "8080"
  depends_on:
    central-kafka:
      condition: service_healthy
    central-db:
      condition: service_healthy
  mem_limit: 256m
  memswap_limit: 256m
  restart: on-failure
  networks: [central]

services:
  plant-kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://plant-kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@plant-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["19092:19092"]
    volumes: [plant-kafka-data:/var/lib/kafka/data]
    mem_limit: 1g
    memswap_limit: 1g
    networks: [plant]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 30

  central-kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://central-kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@central-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["29092:29092"]
    volumes: [central-kafka-data:/var/lib/kafka/data]
    mem_limit: 1g
    memswap_limit: 1g
    networks: [central]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 30

  central-db:
    image: postgres:18.6-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: edd
      POSTGRES_PASSWORD: edd
      POSTGRES_DB: edd
    ports: ["55432:5432"]
    volumes:
      # PostgreSQL 18 keeps data under a version-specific directory, so mount the parent
      - central-db-data:/var/lib/postgresql
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    mem_limit: 256m
    memswap_limit: 256m
    networks: [central]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edd -d edd"]
      interval: 5s
      retries: 30

  plant-topics:
    image: apache/kafka:4.4.0
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    volumes: [./kafka/create-topics.sh:/create-topics.sh:ro]
    depends_on:
      plant-kafka:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    networks: [plant]

  gateway-prs:
    <<: *gateway
    environment:
      <<: *gateway-env
      Gateway__Shop: PRS
      Gateway__Seed: "1000"
    volumes: [gateway-prs-data:/data]

  gateway-bdy:
    <<: *gateway
    environment:
      <<: *gateway-env
      Gateway__Shop: BDY
      Gateway__Seed: "2000"
    volumes: [gateway-bdy-data:/data]

  gateway-pnt:
    <<: *gateway
    environment:
      <<: *gateway-env
      Gateway__Shop: PNT
      Gateway__Seed: "3000"
    volumes: [gateway-pnt-data:/data]

  gateway-mch:
    <<: *gateway
    environment:
      <<: *gateway-env
      Gateway__Shop: MCH
      Gateway__Seed: "4000"
    volumes: [gateway-mch-data:/data]

  gateway-asm:
    <<: *gateway
    environment:
      <<: *gateway-env
      Gateway__Shop: ASM
      Gateway__Seed: "5000"
    volumes: [gateway-asm-data:/data]

  mm2:
    image: apache/kafka:4.4.0
    command: ["/opt/kafka/bin/connect-mirror-maker.sh", "/etc/mm2/mm2.properties"]
    environment:
      # connect-mirror-maker.sh defaults to a 2 GB heap
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes: [./kafka/mm2.properties:/etc/mm2/mm2.properties:ro]
    depends_on:
      plant-kafka:
        condition: service_healthy
      central-kafka:
        condition: service_healthy
      plant-topics:
        condition: service_completed_successfully
    mem_limit: 768m
    memswap_limit: 768m
    restart: on-failure
    networks: [plant, central]

  consumer-1:
    <<: *consumer
    environment:
      <<: *consumer-env
      Consumer__Id: consumer-1

  consumer-2:
    <<: *consumer
    environment:
      <<: *consumer-env
      Consumer__Id: consumer-2

networks:
  plant:
  central:
  ops:

volumes:
  plant-kafka-data:
  central-kafka-data:
  central-db-data:
  gateway-prs-data:
  gateway-bdy-data:
  gateway-pnt-data:
  gateway-mch-data:
  gateway-asm-data:
