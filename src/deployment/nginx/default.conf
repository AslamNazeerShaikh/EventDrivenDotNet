# Docker's embedded DNS. The `resolve` parameter lets nginx start without the APIs
# and follow the containers across restarts.
resolver 127.0.0.11 valid=5s;

upstream api {
    zone api 64k;
    ip_hash;                    # one viewer reads one API's snapshot, so the numbers do not jump between two
    server api-1:8080 resolve max_fails=1 fail_timeout=5s;
    server api-2:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api;
        proxy_next_upstream error timeout non_idempotent;   # every command is idempotent (doc 02 §4.6)
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
    }

    # The full proof counts duplicate rows across the whole table (up to 60 s at the API).
    location = /api/reconciliation {
        proxy_pass http://api;
        proxy_next_upstream error timeout;
        proxy_connect_timeout 1s;
        proxy_read_timeout 65s;
    }

    location / {
        try_files $uri /index.html;
    }
}
