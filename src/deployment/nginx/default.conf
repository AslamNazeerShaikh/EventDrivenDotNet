server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. The variable below makes nginx resolve "api" per request,
    # so it starts without the API and follows the API container across restarts.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri /index.html;
    }
}
